name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify dedicated-token WordPress bridge health probe (mock only)
        run: node --test scripts/test-probe-wordpress-ai-bridge.mjs
      - name: Verify non-mutating TikTok Business Messaging preflight (mock only)
        run: node --test scripts/test-probe-tiktok-messaging-preflight.mjs
      - name: Verify compiled artifact fingerprint
        run: |
          node --input-type=module -e "
            import { runtimeBuildIdentity } from './dist/observability/build-identity.js';
            const digest = runtimeBuildIdentity().artifactSha256;
            if (digest === null || !/^[0-9a-f]{64}$/.test(digest)) {
              throw new Error('Compiled artifact identity was unavailable');
            }
            console.log('ISHIKEIT_ARTIFACT_SHA256=' + digest);
          "

      - name: Verify installed fast-uri packages and fingerprint
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { join } from 'node:path';
            import { FAST_URI_PACKAGE_PATHS, digestInstalledFastUriMetadata } from './dist/observability/build-identity.js';
            const expected = ['3.1.9', '3.1.9', '3.1.9', '4.2.3'];
            for (let i = 0; i < expected.length; i++) {
              const metadata = JSON.parse(readFileSync(join(process.cwd(), FAST_URI_PACKAGE_PATHS[i], 'package.json'), 'utf8'));
              if (metadata.name !== 'fast-uri' || metadata.version !== expected[i]) {
                throw new Error('Patched fast-uri version missing from installed npm tree');
              }
            }
            const digest = digestInstalledFastUriMetadata(process.cwd());
            if (digest === null || !/^[0-9a-f]{64}$/.test(digest)) {
              throw new Error('Installed fast-uri dependency fingerprint unavailable');
            }
            console.log('ISHIKEIT_INSTALLED_FAST_URI_SHA256=' + digest);
          "

  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Lint WordPress bridge
        run: find wordpress/ishi-ai-bridge -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify sanitized AI Bridge diagnostics
        run: php tests/php/ishi-ai-bridge-diagnostics.php

  context-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify durable context continuity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          CONTEXT_SKIP: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'context-not-required') }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" && "$CONTEXT_SKIP" == "true" ]]; then
            echo "context-not-required label present; continuity guard bypassed."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            range="$base...HEAD"
          else
            base="$PUSH_BEFORE_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
            if [[ -z "$base" ]]; then
              echo "No previous revision is available; skipping continuity comparison."
              exit 0
            fi
            range="$base..HEAD"
          fi

          mapfile -t changed < <(git diff --name-only "$range")
          printf 'Changed files:\n%s\n' "${changed[*]}"

          material=false
          for path in "${changed[@]}"; do
            case "$path" in
              src/*|migrations/*|wordpress/*|.env.example|package.json|package-lock.json|tsconfig.json|tsconfig.build.json|eslint.config.js|.github/workflows/*)
                material=true
                break
                ;;
            esac
          done

          if [[ "$material" != "true" ]]; then
            echo "No context-sensitive project boundary changed."
            exit 0
          fi

          for path in "${changed[@]}"; do
            if [[ "$path" == "docs/CONTINUATION.md" ]]; then
              echo "Durable continuation context updated with the context-sensitive change."
              exit 0
            fi
          done

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "::error::This pull request changes a context-sensitive project boundary but does not update docs/CONTINUATION.md. Update the durable context, or apply the context-not-required label when the change has no durable project-context impact."
          else
            echo "::error::main received a context-sensitive change without a docs/CONTINUATION.md update. Add a follow-up durable-context correction immediately."
          fi
          exit 1
