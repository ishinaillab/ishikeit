name: CI

on:
  push:
    branches: ["main", "foundation-v1"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - name: Emit generated lockfile
        run: |
          echo "ISHIKEIT_LOCKFILE_BEGIN"
          cat package-lock.json
          echo "ISHIKEIT_LOCKFILE_END"
      - run: npm run check
