name: Ishikeit continuity observer

# This workflow observes only a public, non-secret coordination ledger. It
# NEVER starts ChatGPT, transfers ownership, deploys or mutates application data.
on:
  schedule:
    # GitHub may delay/drop scheduled runs. Choose off-peak minutes, not :00.
    - cron: '23,53 * * * *'
  # Off-hour schedule can be delayed or missed. Independently observe each
  # successful protected-main CI push, WITHOUT running PR/fork artifacts.
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read only, never open a manual review issue'
        type: boolean
        required: true
        default: true
  push:
    branches: ['main']
    paths:
      - '.github/workflows/ishikeit-continuity-observer.yml'
      - 'scripts/continuity-observer.mjs'
      - 'scripts/test-continuity-observer.mjs'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: ishikeit-continuity-observer
  cancel-in-progress: false

jobs:
  observe:
    # A manually dispatched feature-branch copy must not obtain issue writes.
    if: >-
      github.repository == 'ishinaillab/ishikeit' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run may be caused by untrusted PR CI. ALWAYS check out
      # trusted protected main only; never the upstream CI head or artifacts.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify monitor behavior with synthetic GitHub responses
        run: node --test scripts/test-continuity-observer.mjs
      - name: Observe GitHub coordination ledger (never take over)
        run: node scripts/continuity-observer.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONTINUITY_ISSUE: '284'
          # Push validates API dry-run. Schedule + successful protected-main CI
          # completion may ONLY open a deduplicated human-review issue.
          DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
