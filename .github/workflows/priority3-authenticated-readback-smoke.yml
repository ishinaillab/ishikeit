name: Priority 3 GitHub authenticated readback compatibility

on:
  pull_request:
    paths:
      - 'scripts/verify-priority3-github-release.mjs'
      - 'scripts/smoke-priority3-github-readback.mjs'
      - '.github/workflows/priority3-authenticated-readback-smoke.yml'
      - '.github/workflows/priority3-protected-schema-release.yml'
      - '.github/workflows/priority3-protected-database-backup.yml'

permissions:
  actions: read
  contents: read

jobs:
  github-readback:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Exercise public app and DB release readbacks via scoped GitHub credential
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/smoke-priority3-github-readback.mjs
